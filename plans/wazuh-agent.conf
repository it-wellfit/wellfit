# Wazuh Agent Configuration for Wellfit
# File: ossec.conf (agent side)
# Place in: /var/ossec/etc/ossec.conf

<ossec_config>
  <client>
    <server>
      <address>wazuh-manager.company.com</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <config-profile>ubuntu, ubuntu22, ubuntu22.04</config-profile>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
    <crypto_method>aes</crypto_method>
  </client>

  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>
    <directories check_all="yes" realtime="yes">/opt/wellfit/data</directories>
    <directories check_all="yes" realtime="yes">/opt/wellfit/config</directories>
    <ignore>/opt/wellfit/data/*.tmp</ignore>
    <ignore>/opt/wellfit/data/*.bak</ignore>
  </syscheck>

  <rootcheck>
    <disabled>no</disabled>
    <check_files>yes</check_files>
    <check_trojans>yes</check_trojans>
    <check_dev>yes</check_dev>
    <check_sys>yes</check_sys>
    <check_pids>yes</check_pids>
    <check_ports>yes</check_ports>
    <check_if>yes</check_if>
  </rootcheck>

  <localfile>
    <log_format>json</log_format>
    <location>/var/log/wellfit/access_audit.log</location>
    <label key="source">wellfit</label>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/wellfit/wellfit.log</location>
  </localfile>

  <active-response>
    <disabled>no</disabled>
    <ca_store>/var/ossec/etc/wpk_root.pem</ca_store>
    <ca_verification>yes</ca_verification>
  </active-response>
</ossec_config>
