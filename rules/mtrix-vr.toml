# MTRIX Validation Rules (VR-01 .. VR-15)
# Externalized from wellfit_mtrix/src/validators.rs
# Format: TOML

[[rules]]
id = "VR-01"
name = "file_name"
scope = "All"
severity = "Error"
action = "FileRejected"
description = "File name prefix, timestamp and delimiter"
manual_page = 3

