[workspace]
members = [
    "crates/wellfit_core",
    "crates/wellfit_reports",
    "crates/wellfit_shopee",
    "crates/wellfit_mtrix",
    "crates/wellfit_cli",
    "crates/wellfit_sync",
    "crates/wellfit_bankpay",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Dachen Industrial Co., Ltd. <tech@dachen.com.tw>"]
license = "MIT"

[workspace.dependencies]
wellfit_core = { path = "crates/wellfit_core" }
wellfit_reports = { path = "crates/wellfit_reports" }
wellfit_shopee = { path = "crates/wellfit_shopee" }
wellfit_mtrix = { path = "crates/wellfit_mtrix" }
wellfit_bankpay = { path = "crates/wellfit_bankpay" }

rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
regex = "1.10"
uuid = { version = "1.8", features = ["v4"] }
encoding_rs = "0.8"
toml = "0.8"
