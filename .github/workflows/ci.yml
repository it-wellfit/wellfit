name: Wellfit CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-test:
    name: Build and Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Type check
        run: cargo check --workspace --all-targets

      - name: Clippy (zero warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: |
          cargo test --workspace
          cargo test -p wellfit_cli --test integration_tests -- --ignored

      - name: Security audit
        run: cargo audit
        continue-on-error: true

  compliance:
    name: ISMS Compliance Verification
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify compliance
        run: powershell -NoProfile -ExecutionPolicy Bypass -File Knowledge/tools/compliance/verify-compliance.ps1

      - name: Validate templates
        run: powershell -NoProfile -ExecutionPolicy Bypass -File Knowledge/tools/compliance/validate-templates.ps1

      - name: Check scope consistency
        run: powershell -NoProfile -ExecutionPolicy Bypass -File Knowledge/tools/compliance/check-scope-consistency.ps1

  mtrix-integration:
    name: MTRIX Integration Test
    runs-on: windows-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --workspace

      - name: Run MTRIX integration
        run: |
          $wf = "target/debug/wellfit.exe"
          & $wf mtrix --dir spec/fixtures/mtrix/delivered --report "$env:TEMP/mtrix-report.json" --batch "CI-TEST" --db "$env:TEMP/ci-ledger.sqlite"
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 2) { exit 1 }

  container-build:
    name: Container Build and Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build container
        run: docker build -t wellfit-mtrix:${{ github.sha }} .

      - name: Trivy security scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: wellfit-mtrix:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 1

  release:
    name: Release
    runs-on: windows-latest
    needs: [build-and-test, compliance, mtrix-integration]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --workspace --release

      - name: Create release bundle
        run: |
          New-Item -ItemType Directory -Path "release" -Force
          Copy-Item "target/release/wellfit.exe" "release/"
          Copy-Item "target/release/wellfit_sync.exe" "release/"
          Compress-Archive -Path "release/*" -DestinationPath "wellfit-${{ github.sha }}.zip"

      - name: Upload release
        uses: actions/upload-artifact@v4
        with:
          name: wellfit-release
          path: wellfit-${{ github.sha }}.zip