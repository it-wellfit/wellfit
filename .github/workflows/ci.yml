name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Install Visual Studio Build Tools
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check

  security:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependency audit
        run: cargo audit

      - name: Secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  mtrix-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --workspace

      - name: MTRIX spec check
        run: cargo run -p wellfit_cli -- spec --format markdown

      - name: MTRIX validation
        run: |
          $target = "$env:TEMP\wellfit-target"
          cargo run -p wellfit_cli -- mtrix --dir "spec/fixtures/mtrix/delivered" --batch "CI" --db "$target\ci.sqlite" --report "$target\ci-report.json"
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3) { exit $LASTEXITCODE }

  release:
    needs: [build-and-test, security, mtrix-validation]
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --workspace --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wellfit-binaries
          path: target/release/wellfit.exe
